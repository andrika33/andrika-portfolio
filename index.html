<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrika</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    .avatar-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
    .avatar-img {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .avatar-img.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .terminal-btn {
      cursor: pointer;
      width: 48px; height: 48px;
      display: flex; justify-content: center; align-items: center;
      border-radius: 10px;
      border: 1.5px solid currentColor;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: inherit;
      opacity: 0.5;
      transition: opacity 0.2s, background 0.2s;
      user-select: none;
    }
    .terminal-btn:hover { opacity: 0.9; }
    .terminal-btn.open {
      opacity: 0;
      pointer-events: none;
    }
    a {
      text-decoration: none !important;
      border-bottom: 1px dashed currentColor;
      padding-bottom: 1px;
      transition: border-style 0.15s ease, opacity 0.15s ease;
    }
    a:hover {
      border-bottom-style: solid;
      opacity: 0.6;
    }
    .copy-btn {
      border-bottom: none !important;
    }
    .toggle-btn {
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid;
      transition: all 0.2s;
      line-height: 1.6;
    }
    .copy-btn {
      display: inline-flex; align-items: center;
      background: none; border: none; cursor: pointer;
      padding: 0 0 0 6px;
      color: inherit; opacity: 0.4;
      transition: opacity 0.2s;
      vertical-align: middle;
    }
    .copy-btn:hover { opacity: 1; }
    .copy-btn svg { width: 14px; height: 14px; }
    .copy-toast {
      display: inline-block;
      font-size: 11px;
      color: #16a34a;
      margin-left: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .copy-toast.show { opacity: 1; }
  </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-800 dark:text-zinc-200 min-h-screen transition-colors duration-300">

  <main class="max-w-xl mx-auto px-6 py-20">

    <!-- Header row: avatar | name+title | toggles -->
    <div class="flex items-center gap-4 mb-10">

      <!-- Terminal icon / Avatar -->
      <div class="avatar-wrap">
        <div class="terminal-btn text-zinc-700 dark:text-zinc-300" id="terminalBtn" onclick="toggleAvatar()">
          &gt;_
        </div>
        <img
          src="photo.jpg"
          alt="Andrika"
          class="avatar-img"
          id="avatarImg"
          onclick="toggleAvatar()"
          style="cursor:pointer;"
          onerror="this.src='https://ui-avatars.com/api/?name=Andrika&size=48&background=18181b&color=fff&rounded=true'"
        />
      </div>

      <!-- Name + Title -->
      <div class="flex-1">
        <h1 class="text-xl font-semibold leading-tight">Andrika</h1>
        <p class="text-sm text-zinc-500 dark:text-zinc-400" id="titleText">Full Stack Web Developer</p>
      </div>

      <!-- Toggles -->
      <div class="flex items-center gap-2">
        <button onclick="toggleLang()" id="langBtn"
          class="toggle-btn border-zinc-300 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 hover:border-zinc-500">
          EN
        </button>
        <button onclick="toggleDark()" id="darkBtn"
          class="toggle-btn border-zinc-300 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 hover:border-zinc-500">
          ☀
        </button>
      </div>

    </div>

    <!-- Bio -->
    <p style="font-size:1.6rem; line-height:1.4; font-weight:600;" class="text-black dark:text-zinc-100 mb-6" id="bioText">
      Full-stack web developer asal Indonesia. Saya membantu bisnis merancang dan membangun aplikasi web yang efisien, mudah digunakan, dan siap skala.
    </p>

    <!-- Resume button -->
    <a href="/andrika-resume.pdf"
      class="inline-flex items-center text-sm text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors duration-200 mb-10"
      style="border: 1px solid currentColor; border-radius: 6px; padding: 6px 14px; text-decoration: none !important; border-bottom: 1px solid currentColor !important;">
      <span id="resumeText">Lihat resume saya</span>
    </a>

    <!-- Links -->
    <div style="font-size:1.25rem;">
      <!-- Email -->
      <div class="flex items-center mb-3">
        <a href="mailto:hello@andrika.my.id" class="text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200">hello@andrika.my.id</a>
        <button class="copy-btn" onclick="copyEmail()" title="Copy email">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
          </svg>
        </button>
        <span class="copy-toast" id="copyToast">copied!</span>
      </div>

      <!-- Social links sejajar -->
      <div class="flex items-center gap-2 flex-wrap text-zinc-500 dark:text-zinc-400">
        <a href="https://github.com/andrika33" target="_blank" rel="noopener" class="hover:text-zinc-700 dark:hover:text-zinc-200">GitHub</a>
        <span class="select-none text-zinc-300 dark:text-zinc-600">·</span>
        <a href="https://www.linkedin.com/in/andrika33" target="_blank" rel="noopener" class="hover:text-zinc-700 dark:hover:text-zinc-200">LinkedIn</a>
        <span class="select-none text-zinc-300 dark:text-zinc-600">·</span>
        <a href="https://t.me/andrika33" target="_blank" rel="noopener" class="hover:text-zinc-700 dark:hover:text-zinc-200">Telegram</a>
      </div>

      <!-- Portfolio link -->
      <div class="text-zinc-500 dark:text-zinc-400 mt-3" id="portfolioLine">
        You can also visit my portfolio <a href="https://portfolio.andrika.my.id" target="_blank" rel="noopener" class="hover:text-zinc-700 dark:hover:text-zinc-200">here</a>.
      </div>
    </div>


  </main>

  <script>
    const content = {
      id: {
        title: 'Full Stack Web Developer',
        bio: 'Full-stack web developer yang menangani keseluruhan sistem, dari tampilan, server, hingga database, tanpa bergantung pada layanan pihak ketiga.',
        langBtn: 'EN',
        resume: 'Lihat resume saya',
        portfolio: 'Kamu juga bisa mengunjungi portfolio saya <a href="https://portfolio.andrika.my.id" target="_blank" rel="noopener" class="hover:text-zinc-700 dark:hover:text-zinc-200">di sini</a>.',
      },
      en: {
        title: 'Full Stack Web Developer',
        bio: 'A full-stack web developer who handles the entire system, from UI to server and database, without relying on third-party services.',
        langBtn: 'ID',
        resume: 'View my resume',
        portfolio: 'You can also visit my portfolio <a href="https://portfolio.andrika.my.id" target="_blank" rel="noopener" class="hover:text-zinc-700 dark:hover:text-zinc-200">here</a>.',
      }
    }

    let lang = localStorage.getItem('lang') || 'id'
    let dark = localStorage.getItem('dark') === 'true'

    function applyLang() {
      const c = content[lang]
      document.getElementById('titleText').textContent = c.title
      document.getElementById('bioText').textContent = c.bio
      document.getElementById('langBtn').textContent = c.langBtn
      document.getElementById('resumeText').textContent = c.resume
      document.getElementById('portfolioLine').innerHTML = c.portfolio
      document.documentElement.lang = lang
    }

    function applyDark() {
      if (dark) {
        document.documentElement.classList.add('dark')
        document.getElementById('darkBtn').textContent = '☾'
      } else {
        document.documentElement.classList.remove('dark')
        document.getElementById('darkBtn').textContent = '☀'
      }
    }

    function toggleLang() {
      lang = lang === 'id' ? 'en' : 'id'
      localStorage.setItem('lang', lang)
      applyLang()
    }

    function toggleDark() {
      dark = !dark
      localStorage.setItem('dark', dark)
      applyDark()
    }

    function toggleAvatar() {
      const img = document.getElementById('avatarImg')
      const btn = document.getElementById('terminalBtn')
      img.classList.toggle('show')
      btn.classList.toggle('open')
    }

    function copyEmail() {
      navigator.clipboard.writeText('hello@andrika.my.id').then(() => {
        const toast = document.getElementById('copyToast')
        toast.classList.add('show')
        setTimeout(() => toast.classList.remove('show'), 2000)
      })
    }

    applyLang()
    applyDark()
  </script>

</body>
</html>
